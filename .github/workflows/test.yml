name: Test

on:
  push:
  pull_request:

jobs:
  theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Load and validate the theme
        run: >-
          nvim --headless --clean
          --cmd "set rtp^=$PWD"
          -l tests/theme_spec.lua
