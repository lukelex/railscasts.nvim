name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Validate Lua syntax and formatting
        run: >-
          docker run --rm --entrypoint bash railscasts-ci
          -o pipefail -c "find colors lua tests -name '*.lua' -print0 | xargs -0 -r luac5.1 -p && stylua --check colors lua tests"

  terminal-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Validate terminal configurations
        run: >-
          docker run --rm --entrypoint bash railscasts-ci
          -o pipefail -c 'kitty +runpy "import kitty.config; bad = []; kitty.config.load_config(\"extras/kitty.conf\", accumulate_bad_lines=bad); assert not bad, bad" && luac5.1 -p extras/wezterm.lua && python3 -c "import json, plistlib, tomllib; tomllib.load(open(\"extras/alacritty.toml\", \"rb\")); json.load(open(\"extras/windows-terminal.json\")); profile = plistlib.load(open(\"extras/iterm2.itermcolors\", \"rb\")); assert all(f\"Ansi {index} Color\" in profile for index in range(16))" && test "$(grep -c '\''^palette = '\'' extras/ghostty.conf)" -eq 16'

  plugin-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Load supported plugin integrations
        run: >-
          docker run --rm --entrypoint /opt/neovim/v0.12.5/bin/nvim railscasts-ci
          --headless --clean --cmd "set rtp^=." -l tests/plugins_spec.lua

  theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: v0.9.5
            parser_dir: ""
          - neovim: v0.10.4
            parser_dir: ""
          - neovim: v0.11.7
            parser_dir: /opt/treesitter/parsers
          - neovim: v0.12.5
            parser_dir: /opt/treesitter/parsers
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Load and validate the theme on ${{ matrix.neovim }}
        run: >-
          docker run --rm --entrypoint bash
          --env RAILSCASTS_PARSER_DIR=${{ matrix.parser_dir }}
          railscasts-ci
          -o pipefail -c
          'nvim="/opt/neovim/${{ matrix.neovim }}/bin/nvim";
          echo "Testing Neovim ${{ matrix.neovim }}";
          "$nvim" --headless --clean --cmd "set rtp^=." -l tests/theme_spec.lua;
          "$nvim" --headless --clean --cmd "set rtp^=." -l tests/screenshot_spec.lua'
