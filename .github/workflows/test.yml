name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Validate Lua syntax
        run: find colors lua tests -name '*.lua' -print0 | xargs -0 -r luac5.1 -p

  theme:
    needs: lua-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.9.5, v0.10.4, v0.11.7, v0.12.5]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Load and validate the theme
        run: >-
          nvim --headless --clean
          --cmd "set rtp^=$PWD"
          -l tests/theme_spec.lua
