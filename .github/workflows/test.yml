name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Validate Lua syntax
        run: >-
          docker run --rm --entrypoint bash railscasts-ci
          -o pipefail -c "find colors lua tests -name '*.lua' -print0 | xargs -0 -r luac5.1 -p"

  theme:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: v0.9.5
            parser_dir: ""
          - neovim: v0.10.4
            parser_dir: ""
          - neovim: v0.11.7
            parser_dir: /opt/treesitter/parsers
          - neovim: v0.12.5
            parser_dir: /opt/treesitter/parsers
    steps:
      - uses: actions/checkout@v4
      - name: Build local CI image
        run: docker build --tag railscasts-ci .
      - name: Load and validate the theme on ${{ matrix.neovim }}
        run: >-
          docker run --rm --entrypoint bash
          --env RAILSCASTS_PARSER_DIR=${{ matrix.parser_dir }}
          railscasts-ci
          -o pipefail -c
          'nvim="/opt/neovim/${{ matrix.neovim }}/bin/nvim";
          echo "Testing Neovim ${{ matrix.neovim }}";
          "$nvim" --headless --clean --cmd "set rtp^=." -l tests/theme_spec.lua'
