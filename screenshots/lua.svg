  <rect width="800" height="42" fill="#333435"/>
  <text x="24" y="28" fill="#E6E1DC" font-family="monospace" font-size="18">episode.lua</text>
  <g font-family="monospace" font-size="21">
    <text x="42" y="94" fill="#CC7833">local</text><text x="115" y="94" fill="#E6E1DC"> Episode </text><text x="223" y="94" fill="#E6E1DC">=</text><text x="250" y="94" fill="#E6E1DC"> {}</text>
    <text x="42" y="144" fill="#CC7833">function</text><text x="145" y="144" fill="#FFC66D"> Episode.new</text><text x="300" y="144" fill="#E6E1DC">(title)</text>
