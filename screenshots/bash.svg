<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#2B2B2B"/>
  <rect width="800" height="42" fill="#333435"/>
  <text x="24" y="28" fill="#E6E1DC" font-family="monospace" font-size="18">release.sh</text>
  <g font-family="monospace" font-size="21">
    <text x="42" y="94" fill="#92764C">#!/usr/bin/env bash</text>
    <text x="42" y="144" fill="#CC7833">set</text><text x="92" y="144" fill="#E6E1DC"> -euo pipefail</text>
    <text x="42" y="204" fill="#E6E1DC">version=</text><text x="150" y="204" fill="#87AF5F">"$1"</text>
    <text x="42" y="264" fill="#CC7833">if</text><text x="75" y="264" fill="#E6E1DC"> [[ -z </text><text x="172" y="264" fill="#87AF5F">"$version"</text><text x="290" y="264" fill="#E6E1DC"> ]]; </text><text x="360" y="264" fill="#CC7833">then</text>
    <text x="72" y="304" fill="#FFC66D">echo</text><text x="135" y="304" fill="#87AF5F"> "usage: release VERSION"</text>
    <text x="72" y="344" fill="#CC7833">exit</text><text x="135" y="344" fill="#A5C261"> 1</text>
    <text x="42" y="384" fill="#CC7833">fi</text>
  </g>
</svg>
